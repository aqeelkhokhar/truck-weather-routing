[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "N", "RET", "PL", "T20", "ERA", "D"]
ignore = ["D1", "D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["PLR0913"]
"manage.py" = ["D"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["trips/tests"]
